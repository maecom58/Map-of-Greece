<html lang="ko">

<title>그리스 신화 지도</title>

body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.85rem;margin:0 0 10px}
.map{position:relative;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--sea)}
svg{display:block;width:100%;height:auto;aspect-ratio:816/374;touch-action:manipulation}
.land{fill:var(--land);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sea{fill:var(--sea);stroke:var(--line);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mk{cursor:pointer}
.lbl{font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--land);stroke-width:3px;text-anchor:middle;pointer-events:none}
.rg{font-size:14px;fill:var(--mut);opacity:.55;text-anchor:middle;letter-spacing:3px;pointer-events:none}
.rg.s{font-style:italic;font-size:15px;letter-spacing:5px}
.rt{fill:none;stroke:var(--route);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
.bar{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.bar button,.tg{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:.8rem}
#reset{display:none}
.tg.on{border-color:var(--route);color:var(--route)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:10px 0;font-size:.78rem;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
details{margin:6px 0}
summary{font-size:.9rem;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 10px;font-size:.82rem;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:6px}
.panel h2{margin:0 0 4px;font-size:1.1rem}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;color:#fff;margin-right:4px}
.panel p{margin:8px 0 12px}
label{font-size:.82rem;color:var(--mut)}
textarea{width:100%;min-height:130px;margin-top:4px;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
.st{font-size:.75rem;color:var(--mut);min-height:1em}
.bk{margin-top:10px;padding:12px 14px;border:1px dashed var(--bd);border-radius:12px}
.bk b{font-size:.9rem}.bk small{display:block;color:var(--mut);margin:2px 0 8px}
.bk .row{display:flex;gap:6px;flex-wrap:wrap}.bk button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏛️ 그리스 신화 지도</h1>
  <p class="sub">장소를 누르면 확대되고, 아래에 나만의 이야기를 적을 수 있어요.</p>
  <div class="map">
    <svg id="svg" viewBox="0 0 816 374" xmlns="http://www.w3.org/2000/svg">
      <rect width="816" height="374" fill="var(--land)"/>
      <path id="sea" class="sea"/>

      <polyline id="rt" class="rt" style="display:none"/>

    <div class="bar"><button id="rbtn" class="tg">오디세우스 항로</button><button id="reset">전체</button></div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--real)"></i>실재 모티브</span>
    <span><i class="dot" style="background:var(--semi)"></i>실재 추정</span>
    <span><i class="dot" style="background:var(--myth)"></i>순수 신화</span>
  </div>
  <details><summary>장소 목록 보기</summary><div class="chips" id="chips"></div></details>
  <div class="panel">
    <h2 id="pt">장소를 선택해 주세요</h2>
    <div><span class="tag" id="ptag" style="display:none"></span><span class="tag" id="pr" style="display:none;background:var(--route)"></span></div>
    <p id="pd">지도 위의 점이나 장소 목록을 눌러 보세요.</p>
    <div id="ned" style="display:none">
      <label for="note">내 이야기</label>
      <textarea id="note" placeholder="이 장소와 관련된 이야기를 적어 보세요…"></textarea>
      <div class="st" id="st"></div>
    </div>
  </div>
  <div class="bk">
    <b>메모 백업</b>
    <small>모든 메모를 파일로 저장해 두면, 어디서든 다시 불러올 수 있어요.</small>
    <div class="row"><button id="bexp">메모 내보내기</button><button id="bimp">메모 불러오기</button></div>
    <input type="file" id="bfile" accept=".json,.txt,application/json,text/plain" style="display:none">

  b.onclick=function(){pick(p[0])};chips.appendChild(b);
});
function layout(){
  var s=vb[2]/svg.clientWidth,zoomed=vb[2]<500,wide=svg.clientWidth>=700;
  P.forEach(function(p){
    var k=s*(sel===p[0]?1.4:1);
    p.g.setAttribute("transform","translate("+X(p[3])+" "+Y(p[4])+") scale("+k+")");
    var inView=X(p[3])>vb[0]-10&&X(p[3])<vb[0]+vb[2]+10&&Y(p[4])>vb[1]-10&&Y(p[4])<vb[1]+vb[3]+10;
    p.t.style.display=((zoomed&&inView)||wide||sel===p[0])?"":"none";
  });
}
function setVB(v){vb=v;svg.setAttribute("viewBox",v.join(" "));layout()}
function go(t){
  cancelAnimationFrame(raf);var a=vb.slice(),t0=performance.now();
  (function f(n){var p=Math.min(1,(n-t0)/700);p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    setVB(a.map(function(v,i){return v+(t[i]-v)*p}));if(p<1)raf=requestAnimationFrame(f)})(t0);
}
function $(i){return document.getElementById(i)}
function pick(id){
  var p=P.filter(function(q){return q[0]===id})[0];sel=id;
  var w=170,h=w*374/816,cx=X(p[3]),cy=Y(p[4]);
  go([Math.max(0,Math.min(816-w,cx-w/2)),Math.max(0,Math.min(374-h,cy-h/2)),w,h]);
  $("reset").style.display="block";
  $("pt").textContent=p[1];
  var tg=$("ptag");tg.style.display="inline-block";tg.textContent=T[p[2]][0];tg.style.background="var("+T[p[2]][1]+")";
  var pr=$("pr");if(p[6]){pr.style.display="inline-block";pr.textContent="오디세우스 항해 "+p[6]+"번째"}else pr.style.display="none";
  $("pd").textContent=p[5];
  $("ned").style.display="block";
  $("note").value=notes[id]||"";$("st").textContent="";
  P.forEach(function(q){$("c-"+q[0]).classList.toggle("on",q[0]===id)});
  $("pt").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("reset").onclick=function(){
  sel=null;go([0,0,816,374]);this.style.display="none";
  P.forEach(function(q){$("c-"+q[0]).classList.remove("on")});
};
$("rbtn").onclick=function(){
  var r=$("rt"),on=r.style.display==="none";r.style.display=on?"":"none";this.classList.toggle("on",on);
};
var dbDoc=null,tmr;
function saveLocal(){try{localStorage.setItem("mythNotes",JSON.stringify(notes))}catch(e){}}
$("note").addEventListener("input",function(){
  if(!sel)return;notes[sel]=this.value;saveLocal();
  var st=$("st");st.textContent="저장 중…";
  clearTimeout(tmr);
  tmr=setTimeout(async function(){
    if(!dbDoc){st.textContent="이 기기에 저장됨";return}
    try{await dbDoc.set({notes:notes});st.textContent="계정에 저장됨 ☁️"}
    catch(e){st.textContent="이 기기에만 저장됨(동기화 실패)"}
  },700);
});
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var u=await claude.use("user"),db=await claude.use("db");
    if(!u||!db)return;
    var uid=await u.id();if(!uid)return;
    dbDoc=db.collection("data/users/"+uid).doc("mythNotes");
    var s=await dbDoc.get();
    if(s.exists){var d=(s.data()||{}).notes||{};for(var k in d)if(d[k])notes[k]=d[k];saveLocal();
      if(sel)$("note").value=notes[sel]||""}
  }catch(e){}
})();
function bmsg(t){$("bmsg").textContent=t}
async function exportNotes(){
  var n=Object.keys(notes).filter(function(k){return notes[k]}).length;
  if(!n){bmsg("저장된 메모가 아직 없어요");return}
  var data=JSON.stringify({app:"greek-myth-map",notes:notes},null,2),d=new Date().toISOString().slice(0,10);
  try{
    if(window.claude&&claude.use){
      var dl=await claude.use("downloads");
      if(dl){
        try{await dl.save({filename:"myth-notes-"+d+".json",data:data})}
        catch(e){if(e&&e.code==="declined"){bmsg("저장을 취소했어요");return}await dl.save({filename:"myth-notes-"+d+".txt",data:data})}
        bmsg(n+"개 장소의 메모를 파일로 저장했어요");return;
      }
    }
  }catch(e){}
  try{
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download="myth-notes-"+d+".json";document.body.appendChild(a);a.click();a.remove();
    bmsg(n+"개 장소의 메모를 파일로 저장했어요");
  }catch(e){bmsg("이 환경에서는 파일 저장이 막혀 있어요")}
}
$("bexp").onclick=exportNotes;
$("bimp").onclick=function(){$("bfile").click()};
$("bfile").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;
  var r=new FileReader();
  r.onload=async function(){
    try{
      var o=JSON.parse(r.result),m=o&&o.notes;
      if(!m||typeof m!=="object")throw 0;
      var c=0;for(var k in m){if(typeof m[k]==="string"&&m[k]){notes[k]=m[k];c++}}
      saveLocal();if(sel)$("note").value=notes[sel]||"";
      if(dbDoc){try{await dbDoc.set({notes:notes})}catch(e){}}
      bmsg(c+"개 장소의 메모를 불러왔어요");
    }catch(e){bmsg("올바른 백업 파일이 아니에요")}
  };
  r.onerror=function(){bmsg("파일을 읽지 못했어요")};
  r.readAsText(f);
};
window.addEventListener("resize",layout);
layout();
</script>
